    <style type="text/tailwindcss"> 
        @layer utilities {

            background-color: #f8f9fa; 
            font-family: "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;

        .pdf-wrapper {
            width: 100%;

            flex-direction: column;
            align-items: center;
        }
        
        #pdf-canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
        }

            .nav-container ul { flex-direction: column; }
